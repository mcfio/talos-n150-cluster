---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${volume_name:=${app}}
spec:
  dataSourceRef:
    kind: Restore
    apiGroup: kopiur.home-operations.com
    name: ${app}
  accessModes:
    - ${volume_accessmodes:=ReadWriteOnce}
  resources:
    requests:
      storage: ${volume_capacity:=1Gi}
  storageClassName: ${volume_storageclass:=ceph-replicated}
