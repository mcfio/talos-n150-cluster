---
# Staged for the Talos 1.14 / Kubernetes 1.37 cutover — HPAScaleToZero must be
# Beta/default-on before this can replace scaledobject.yaml (minReplicas: 0
# with an External metric is rejected on today's 1.36 control plane). Not
# referenced by kustomization.yaml yet.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${app}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${app}
  minReplicas: 0
  maxReplicas: 1
  metrics:
    - type: External
      external:
        metric:
          name: nfs_server_ready
        target:
          type: Value
          value: "1"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 10
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
