---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-5.0.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airprint
spec:
  interval: 12h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      airprint:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: chuckcharlie/cups-avahi-airprint
              tag: 2.1.3@sha256:f25e5338e8bc469e7666cb3676c5dfb0dedd953636e58390807008f7f9071be2
            env:
              TZ: Canada/Eastern
              AVAHI_HOSTNAME: airprint
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            # Runs as root by design: it owns a system dbus-daemon + avahi-daemon
            # and symlinks parts of /etc/cups to /config at startup, so
            # runAsNonRoot/readOnlyRootFilesystem aren't compatible with this image.
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "client-network",
            "namespace": "kube-system",
            "ips": ["192.168.10.23/24"],
            "mac": "1a:7c:4f:92:3d:60"
          }]
    service:
      app:
        ports:
          http:
            port: 631
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.milton.mcf.io"
        parentRefs:
          - name: internal
            namespace: ingress-system
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
