---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${app}
spec:
  repository:
    name: archive
  # Pins the existing snapshot identity so kopiur continues the adopted history.
  identity:
    hostname: default
    username: ${app}
  sources:
    - pvc:
        name: ${volume_name:=${app}}
      sourcePathOverride: /data
  copyMethod: Snapshot
  volumeSnapshotClassName: ${volume_snapshotclass:=csi-ceph-blockpool}
  compression:
    compressor: zstd-fastest
  upload:
    maxParallelFileReads: ${volume_parallelism:=2}
  retention:
    keepLatest: 45 # ~2 weeks at the current 3-snapshots/day schedule
  mover:
    # zwave runs privileged as root with no pinned UID; the session-secret file is root-only.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
