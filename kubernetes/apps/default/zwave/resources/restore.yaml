---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${app}
spec:
  source:
    fromPolicy:
      name: ${app}
      offset: 0 # latest snapshot
  target:
    populator: {} # passive: the PVC claims this via its own dataSourceRef
  policy:
    onMissingSnapshot: Continue # empty-volume bootstrap on first apply
