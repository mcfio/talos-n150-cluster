---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: archive
spec:
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: 10.46.100.100 # Use IP instead of nfs-server.default.svc.cluster.local
          path: /archive/kopia
  encryption:
    passwordSecretRef:
      name: kopiur-repository
      key: KOPIA_PASSWORD
  create:
    enabled: false # adopting the existing repository, never reinitialize it
