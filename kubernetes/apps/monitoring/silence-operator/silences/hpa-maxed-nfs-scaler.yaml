---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
# Staged for the KEDA -> native HPA cutover (see ../../../components/nfs-scaler).
# Swap for keda-hpa-maxed.yaml in kustomization.yaml once the HPAs are live —
# until then the KEDA-generated `keda-hpa-*` HPAs still need the old silence.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: nfs-scaler-hpa-maxed-out
spec:
  matchers:
    - name: alertname
      value: KubeHpaMaxedOut
    - name: horizontalpodautoscaler
      value: (sonarr|radarr|listenarr|sabnzbd|plex)
      matchType: =~
