            "sizing": "auto",
            "minVizWidth": 25,
            "minVizHeight": 25,
            "text": {
              "titleSize": 10,
              "valueSize": 18
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
