---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kiosk-cluster
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  uid: kiosk-cluster
  folderRef: kiosk
  resyncPeriod: 10m
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  json: |-
    {
      "__inputs": [
        {
          "label": "prometheus",
          "name": "DS_PROMETHEUS",
          "pluginId": "prometheus",
          "pluginName": "Prometheus",
          "type": "datasource"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "stat",
          "title": "Nodes Ready",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "instant": false,
              "legendFormat": "",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}) / count(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "text": {
              "titleSize": 10,
              "valueSize": 22
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "color": "#a6e3a1",
                      "index": 0,
                      "text": "ALL UP"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 0.5,
                    "to": 0.999,
                    "result": {
                      "color": "#f9e2af",
                      "index": 1,
                      "text": "DEGRADED"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 0.499,
                    "result": {
                      "color": "#f38ba8",
                      "index": 2,
                      "text": "DOWN"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "gauge",
          "title": "CPU Used",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "cluster:node_cpu:ratio_rate5m",
              "refId": "A",
              "legendFormat": "",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto",
            "minVizWidth": 25,
            "minVizHeight": 25,
            "text": {
              "titleSize": 10,
              "valueSize": 18
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 0.8
                  },
                  {
                    "color": "#f38ba8",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "gauge",
          "title": "CPU Req",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(namespace_cpu:kube_pod_container_resource_requests:sum) / sum(kube_node_status_allocatable{resource='cpu'})",
              "refId": "A",
              "legendFormat": "",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
