        {
          "type": "timeseries",
          "title": "CPU by namespace",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m) by (namespace)",
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "instant": false
            }
          ],
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true,
              "width": 110
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1,
              "min": 0,
              "mappings": [],
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 12,
                "gradientMode": "none",
                "showPoints": "never",
                "pointSize": 5,
                "spanNulls": true,
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisTicks": 3,
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*"
                },
                "properties": [
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 18
                  }
                ]
              }
            ]
          }
        },
