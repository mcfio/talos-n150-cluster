---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kiosk-kopiur
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  uid: kiosk-kopiur
  folderRef: kiosk
  resyncPeriod: 10m
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  json: |-
    {
      "__inputs": [
        {
          "label": "prometheus",
          "name": "DS_PROMETHEUS",
          "pluginId": "prometheus",
          "pluginName": "Prometheus",
          "type": "datasource"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "stat",
          "title": "Restore Points",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "min(count by (policy) (kopiur_snapshot_last_success_timestamp_seconds))",
              "legendFormat": "",
              "refId": "A",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#f38ba8",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 36.0
                  },
                  {
                    "color": "#a6e3a1",
                    "value": 45
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Newest",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 5,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "min(time() - kopiur_policy_last_backup_success_timestamp_seconds)",
              "legendFormat": "",
              "refId": "A",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 43200.0
                  },
                  {
                    "color": "#f38ba8",
                    "value": 57600
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Behind",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 9,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "count(time() - kopiur_policy_last_backup_success_timestamp_seconds > 28800) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "text": {
              "titleSize": 11,
              "valueSize": 26
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "color": "#a6e3a1",
                      "index": 0,
                      "text": "ALL CURRENT"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f38ba8",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Failing",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 13,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "count(kopiur_snapshot_consecutive_failures > 0) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "text": {
              "titleSize": 11,
              "valueSize": 26
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "color": "#a6e3a1",
                      "index": 0,
                      "text": "NONE"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f38ba8",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Incomplete",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 17,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "count(count by (policy) (kopiur_snapshot_last_success_timestamp_seconds) < 45) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "text": {
              "titleSize": 11,
              "valueSize": 26
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "color": "#a6e3a1",
                      "index": 0,
                      "text": "NONE"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f38ba8",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Size",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(kopiur_policy_last_backup_size_bytes)",
              "legendFormat": "",
              "refId": "A",
              "instant": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "center",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "barchart",
          "title": "Slowest backup per policy — 7 days",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 6,
            "w": 14,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "instant": true,
              "legendFormat": "{{policy}}",
              "expr": "max by (policy) (max_over_time(kopiur_policy_last_backup_duration_seconds[7d]))"
            }
          ],
          "options": {
            "orientation": "vertical",
            "showValue": "auto",
            "stacking": "none",
            "xField": "Field",
            "barWidth": 0.85,
            "groupWidth": 0.9,
            "fullHighlight": false,
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0,
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            },
            "xTickLabelMaxLength": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "min": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 80,
                "gradientMode": "none",
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisTicks": 3,
                "axisGridShow": true,
                "axisBorderShow": false,
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 90
                  },
                  {
                    "color": "#f38ba8",
                    "value": 300
                  }
                ]
              }
            },
            "overrides": []
          },
          "transformations": [
            {
              "id": "reduce",
              "options": {
                "reducers": [
                  "lastNotNull"
                ],
                "mode": "seriesToRows"
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Last *",
                    "desc": true
                  }
                ]
              }
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "mappings": [],
              "max": null,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 10,
            "x": 14,
            "y": 4
          },
          "id": 8,
          "options": {
            "displayMode": "lcd",
            "minVizHeight": 8,
            "minVizWidth": 8,
            "namePlacement": "left",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "manual",
            "valueMode": "color",
            "maxVizHeight": 20
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "topk(8, kopiur_policy_last_backup_size_bytes)",
              "instant": false,
              "legendFormat": "{{policy}}",
              "refId": "A"
            }
          ],
          "title": "Last backup size",
          "type": "bargauge"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "kiosk"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kiosk / Backups",
      "uid": "kiosk-kopiur"
    }
