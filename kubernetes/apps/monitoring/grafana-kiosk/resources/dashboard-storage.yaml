---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kiosk-storage
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  uid: kiosk-storage
  folderRef: kiosk
  resyncPeriod: 10m
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  json: |-
    {
      "__inputs": [
        {
          "label": "prometheus",
          "name": "DS_PROMETHEUS",
          "pluginId": "prometheus",
          "pluginName": "Prometheus",
          "type": "datasource"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 70
                  },
                  {
                    "color": "#f38ba8",
                    "value": 85
                  }
                ]
              },
              "unit": "percent",
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true,
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "100 * ceph_cluster_total_used_bytes / ceph_cluster_total_bytes",
              "instant": false,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Ceph Used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "color": "#a6e3a1",
                      "index": 0,
                      "text": "ALL UP"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 0.5,
                    "to": 0.999,
                    "result": {
                      "color": "#f9e2af",
                      "index": 1,
                      "text": "DEGRADED"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 0.499,
                    "result": {
                      "color": "#f38ba8",
                      "index": 2,
                      "text": "DOWN"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#f38ba8",
                    "value": null
                  },
                  {
                    "color": "#a6e3a1",
                    "value": 3
                  }
                ]
              },
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true,
            "text": {
              "titleSize": 11,
              "valueSize": 26
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(ceph_osd_up) / count(ceph_osd_up)",
              "instant": false,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "OSDs Up",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#f38ba8",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 1500000000000.0
                  },
                  {
                    "color": "#a6e3a1",
                    "value": 3000000000000.0
                  }
                ]
              },
              "unit": "bytes",
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true,
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(node_filesystem_avail_bytes{instance=\"talos-stor01\",mountpoint=~\"/var/mnt/media-disk.*\"})",
              "instant": false,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Media Free",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 85
                  },
                  {
                    "color": "#f38ba8",
                    "value": 93
                  }
                ]
              },
              "unit": "percent",
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true,
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "100 - 100 * sum(node_filesystem_avail_bytes{instance=\"talos-stor01\",mountpoint=~\"/var/mnt/media-disk.*\"}) / sum(node_filesystem_size_bytes{instance=\"talos-stor01\",mountpoint=~\"/var/mnt/media-disk.*\"})",
              "instant": false,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Media Used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 80
                  },
                  {
                    "color": "#f38ba8",
                    "value": 90
                  }
                ]
              },
              "unit": "percent",
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true,
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "max(100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)",
              "instant": false,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Top PVC",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 55
                  },
                  {
                    "color": "#f38ba8",
                    "value": 65
                  }
                ]
              },
              "unit": "celsius",
              "color": {
                "mode": "fixed",
                "fixedColor": "#cdd6f4"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 6,
          "options": {
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true,
            "text": {
              "titleSize": 11,
              "valueSize": 38
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "max(smartctl_device_temperature{temperature_type=\"current\"})",
              "instant": false,
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Disk Temp",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "mappings": [],
              "max": 4000000000000.0,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#f38ba8",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 300000000000.0
                  },
                  {
                    "color": "#a6e3a1",
                    "value": 700000000000.0
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 4
          },
          "id": 7,
          "options": {
            "displayMode": "lcd",
            "minVizHeight": 8,
            "minVizWidth": 8,
            "namePlacement": "left",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "manual",
            "valueMode": "color",
            "maxVizHeight": 20
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "node_filesystem_avail_bytes{instance=\"talos-stor01\",mountpoint=~\"/var/mnt/media-disk.*\"}",
              "instant": false,
              "legendFormat": "{{mountpoint}}",
              "refId": "A"
            }
          ],
          "title": "Free per media disk",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#a6e3a1",
                    "value": null
                  },
                  {
                    "color": "#f9e2af",
                    "value": 80
                  },
                  {
                    "color": "#f38ba8",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 4
          },
          "id": 8,
          "options": {
            "displayMode": "lcd",
            "minVizHeight": 8,
            "minVizWidth": 8,
            "namePlacement": "left",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "manual",
            "valueMode": "color",
            "maxVizHeight": 20
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "topk(5, 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)",
              "instant": false,
              "legendFormat": "{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "Top PVCs",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 12,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "max": null,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "iops"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*"
                },
                "properties": [
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 18
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 4
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(ceph_osd_op_r[5m]))",
              "instant": false,
              "legendFormat": "read",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(ceph_osd_op_w[5m]))",
              "instant": false,
              "legendFormat": "write",
              "refId": "B"
            }
          ],
          "title": "Ceph IOPS",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "kiosk"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Kiosk / Storage",
      "uid": "kiosk-storage"
    }
