---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appname prometheus-adapter
spec:
  interval: 12h
  chartRef:
    kind: OCIRepository
    name: prometheus-adapter
  values:
    fullnameOverride: *appname
    prometheus:
      url: http://prometheus-operated.monitoring.svc.cluster.local
      port: 9090
    rules:
      default: false
      external:
        - seriesQuery: kube_pod_status_ready{namespace="default",pod=~"nfs-server-.*",condition="true"}
          resources:
            namespaced: false
          name:
            as: nfs_server_ready
          metricsQuery: max(<<.Series>>{<<.LabelMatchers>>})
