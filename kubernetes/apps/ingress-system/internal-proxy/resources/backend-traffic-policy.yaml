---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: internal
spec:
  # Each type needs its (empty) config block or the compressor is skipped
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
  tcpKeepalive:
    idleTime: 60s
    interval: 10s
    probes: 3
  timeout:
    http:
      # Must stay under the backends' own idle timeouts (Go servers default to
      # 1m) or Envoy races their reaper and returns 503 UC on a pooled conn
      connectionIdleTimeout: 30s
      requestTimeout: 0s
      streamIdleTimeout: 1h
