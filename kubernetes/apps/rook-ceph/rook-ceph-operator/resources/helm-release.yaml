---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 12h
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    csi:
      cephcsi:
        tag: v3.16.3 # stor01 CPU is incompatible with v3.17+; revert once ceph-csi publishes a -rocky9 image
      serviceMonitor:
        enabled: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
