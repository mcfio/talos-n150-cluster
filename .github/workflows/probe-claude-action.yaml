---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# THROWAWAY probe: does claude-code-action work against the Copilot-backed LiteLLM
# gateway? Answers three things the curator refactor depends on — CF Access headers
# reach the CLI, agentic tool-use survives the Copilot translation, and --json-schema
# populates structured_output. Delete once answered.
name: probe-claude-action
# push-on-branch, not workflow_dispatch: a dispatchable workflow must already exist on
# the default branch, and this one is never merging there.
on:
  push:
    branches: [probe/claude-action-litellm]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # settings.env is the only lever that works: it lands in ~/.claude/settings.json,
      # which outranks process env. ANTHROPIC_CUSTOM_HEADERS carries the CF Access
      # service token (verified on the wire against a local listener, CLI 2.1.283).
      - name: Run Claude against LiteLLM
        id: claude
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          anthropic_api_key: ${{ secrets.LITELLM_API_KEY }}
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ vars.LITELLM_BASE_URL }}",
                "ANTHROPIC_CUSTOM_HEADERS": "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}\nCF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
              }
            }
          # Forces a real tool call (Read) before answering, so a pass proves agentic
          # tool-use survives the gateway, not just that a single completion returned.
          prompt: |
            Read the file .github/curator/policy.yaml in this repo.

            Report how many rules are under the `exclude_rendered` key, and quote the
            `reason` field of the first one verbatim.
          claude_args: |
            --model curator-model
            --allowedTools "Read"
            --json-schema '{"type":"object","additionalProperties":false,"required":["rule_count","first_reason","tool_worked"],"properties":{"rule_count":{"type":"integer"},"first_reason":{"type":"string"},"tool_worked":{"type":"boolean"}}}'

      - name: Report
        if: always()
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          {
            echo "## Probe result"
            echo
            echo "- conclusion: \`${CONCLUSION:-<none>}\`"
            echo "- structured_output: \`${STRUCTURED:-<empty>}\`"
            echo
            if [ -n "${STRUCTURED:-}" ] && echo "$STRUCTURED" | jq -e '.rule_count == 7' >/dev/null 2>&1; then
              echo "PASS — gateway reachable, Read tool ran, schema honoured."
            else
              echo "FAIL or partial — see the action step log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
