---
machine:
  type: worker
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.transport == "sata" && !disk.rotational
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nfsd
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  mcf.io/role: storage
---
# Registration-time taints, not KubeNodeConfig.taints: NodeRestriction denies a worker the PATCH
# that the taints field goes through.
apiVersion: v1alpha1
kind: KubeletConfig
config:
  registerWithTaints:
    - key: mcf.io/role
      value: storage
      effect: PreferNoSchedule
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: talos-stor01
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: media-disk1
discovery:
  volumeSelector:
    match: volume.label == "media-disk1"
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: media-disk2
discovery:
  volumeSelector:
    match: volume.label == "media-disk2"
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: media-disk3
discovery:
  volumeSelector:
    match: volume.label == "media-disk3"
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: media-disk4
discovery:
  volumeSelector:
    match: volume.label == "media-disk4"
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: media-disk5
discovery:
  volumeSelector:
    match: volume.label == "media-disk5"
