# mise tasks for Talos node management. The logic lives in talos.nu; these are argument shims.
#
[tools]
talosctl = "1.13.8"

[tasks.nodes]
description = "Show declared nodes against live cluster state"
alias = "tn"
quiet = true
shell = "nu --no-config-file -c"
run = 'use {{ config_root }}/talos.nu; talos nodes'

[tasks.render-config]
description = "Render the machine config for a node"
alias = "trc"
quiet = true
shell = "nu --no-config-file -c"
usage = '''
arg "<node>"
complete "node" run="mise run //talos:node-names"
'''
run = 'use {{ config_root }}/talos.nu; talos show $env.usage_node'

[tasks.node-names]
hide = true
quiet = true
shell = "nu --no-config-file -c"
run = 'use {{ config_root }}/talos.nu; talos node-names | to text'

[tasks.validate]
description = "Validate every node's rendered machine config offline"
alias = "tv"
quiet = true
shell = "nu --no-config-file -c"
run = 'use {{ config_root }}/talos.nu; talos validate'

[tasks.diff]
description = "Diff rendered configs against what the nodes are running (all nodes by default)"
alias = "td"
quiet = true
shell = "nu --no-config-file -c"
usage = '''
arg "[node]"
complete "node" run="mise run //talos:node-names"
'''
run = 'use {{ config_root }}/talos.nu; talos diff ...($env.usage_node? | default "" | split row " " | where {|n| $n != "" })'

[tasks.apply-config]
description = "Apply the rendered machine config to a node."
alias = "tac"
quiet = true
shell = "nu --no-config-file -c"
usage = '''
arg "<node>"
complete "node" run="mise run //talos:node-names"
arg "[args]" var=#true
'''
run = '''
use {{ config_root }}/talos.nu
talos apply $env.usage_node ...($env.usage_args? | default "" | split row " " | where {|arg| $arg != "" })
'''

[tasks.upgrade-k8s]
quiet = true
shell = "nu --no-config-file -c"
usage = '''
arg "<version>"
'''
run = 'use {{ config_root }}/talos.nu; talos upgrade-k8s $env.usage_version'

[tasks.download-image]
description = "Download Talos machine image"
quiet = true
shell = "nu --no-config-file -c"
usage = '''
arg "<version>"
'''
run = 'use {{ config_root }}/talos.nu; talos download-image $env.usage_version'

[tasks.lifecycle]
description = "Perform lifecycle actions on a node"
quiet = true
shell = "nu --no-config-file -c"
usage = '''
arg "<action>" {
  choices "upgrade" "reboot" "reset" "shutdown"
}
arg "<node>"
complete "node" run="mise run //talos:node-names"
'''
run = 'use {{ config_root }}/talos.nu; talos lifecycle $env.usage_action $env.usage_node'
