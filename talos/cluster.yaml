---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/tags/v1.14.0/website/content/v1.14/schemas/config.schema.json
version: v1alpha1
machine:
  token: op://milton-ops/talos-n150-cluster/machine/token
  ca:
    crt: op://milton-ops/talos-n150-cluster/machine/ca_crt
  features:
    diskQuotaSupport: true
cluster:
  token: op://milton-ops/talos-n150-cluster/cluster/token
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/{{ schematic_id }}:v1.14.0
provisioning:
  wipe: false
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  resolveMemberNames: true
  forwardKubeDNSToHost: false
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: containerd
content: |-
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfsmount.conf
mode: 0o644
contents: |-
  [ NFSMount_Global_Options ]
  nfsvers=4.2
  hard=True
  noatime=True
  timeo=600
  softreval
  retrans=2
  nconnect=4
  rsize=131072
  wsize=131072
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_user_watches: "1048576" # Watchdog
  fs.inotify.max_user_instances: "8192" # Watchdog
  net.core.rmem_max: "67108864" # Cloudflared / QUIC
  net.core.wmem_max: "67108864" # Cloudflared / QUIC
  user.max_user_namespaces: "65535" # User namespaces
---
apiVersion: v1alpha1
kind: KubeletConfig
image: ghcr.io/siderolabs/kubelet:v1.36.4
defaultRuntimeSeccompProfileEnabled: true
config:
  serializeImagePulls: false
  imageGCHighThresholdPercent: 70
  imageGCLowThresholdPercent: 50
  shutdownGracePeriod: 60s
  featureGates:
    MemoryQoS: true
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.45.0/24
---
apiVersion: v1alpha1
kind: KubeClusterConfig
clusterName: home-cluster
endpoint: https://k8s.internal:6443
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - 10.45.0.0/16
serviceSubnets:
  - 10.46.0.0/16
---
apiVersion: v1alpha1
kind: DiscoveryIdentityConfig
clusterID: op://milton-ops/talos-n150-cluster/cluster/id
clusterSecret: op://milton-ops/talos-n150-cluster/cluster/secret
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: primary
endpoint: https://discovery.talos.dev/
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: primary0
selector:
  match: link.permanent_addr.size() != 0 && link.kind == ""
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: primary0
clientIdentifier: mac
---
apiVersion: v1alpha1
kind: VLANConfig
name: vlan10
vlanID: 10
vlanMode: 802.1q
parent: primary0
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - 192.168.10.30
---
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m
