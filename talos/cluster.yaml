---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.13/website/content/v1.13/schemas/config.schema.json
version: v1alpha1
machine:
  token: op://mcfio/talos-n150-cluster/machine/token
  ca:
    crt: op://mcfio/talos-n150-cluster/machine/ca_crt
  features:
    diskQuotaSupport: true
    hostDNS:
      enabled: true
      resolveMemberNames: true
      forwardKubeDNSToHost: false
    kubePrism:
      enabled: true
      port: 7445
  install:
    diskSelector:
      type: nvme
    image: factory.talos.dev/metal-installer/{{ schematic_id }}:v1.13.9
    wipe: false
    grubUseUKICmdline: true
  files:
    - path: /etc/cri/conf.d/20-customization.part
      op: create
      content: |-
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          device_ownership_from_security_context = true
    - path: /etc/nfsmount.conf
      op: overwrite
      permissions: 0o644
      content: |-
        [ NFSMount_Global_Options ]
        nfsvers=4.2
        hard=True
        noatime=True
        timeo=600
        softreval
        retrans=2
        nconnect=4
        rsize=131072
        wsize=131072
  kubelet:
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraConfig:
      serializeImagePulls: false
      imageGCHighThresholdPercent: 70
      imageGCLowThresholdPercent: 50
      shutdownGracePeriod: 60s
      allowedUnsafeSysctls:
        - net.ipv6.conf.net1.accept_ra_rt_info_max_plen # Accept max plen for ipv6 thread border router advertisements
    image: ghcr.io/siderolabs/kubelet:v1.36.3
    nodeIP:
      validSubnets:
        - 192.168.45.0/24
  sysctls:
    fs.inotify.max_user_watches: "1048576" # Watchdog
    fs.inotify.max_user_instances: "8192" # Watchdog
    net.core.rmem_max: "67108864" # Cloudflared / QUIC
    net.core.wmem_max: "67108864" # Cloudflared / QUIC
    user.max_user_namespaces: "65535" # User namespaces
cluster:
  id: op://mcfio/talos-n150-cluster/cluster/id
  secret: op://mcfio/talos-n150-cluster/cluster/secret
  ca:
    crt: op://mcfio/talos-n150-cluster/cluster/ca_crt
  controlPlane:
    endpoint: https://k8s.internal:6443
  clusterName: home-cluster
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service:
        disabled: false
  network:
    cni:
      name: none
    dnsDomain: cluster.local
    podSubnets:
      - 10.45.0.0/16
    serviceSubnets:
      - 10.46.0.0/16
  token: op://mcfio/talos-n150-cluster/cluster/token
  proxy:
    disabled: true
    image: registry.k8s.io/kube-proxy:v1.36.3
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: primary0
selector:
  match: link.permanent_addr.size() != 0 && link.kind == ""
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: primary0
clientIdentifier: mac
---
apiVersion: v1alpha1
kind: VLANConfig
name: vlan10
vlanID: 10
vlanMode: 802.1q
parent: primary0
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - 192.168.10.30
---
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m
